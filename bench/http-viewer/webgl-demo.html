<!doctype html><meta charset="utf-8"><title>WebGL viewer replay</title>
<canvas id="surface" width="16" height="16"></canvas>
<button id="read">Read runtime pixels</button><pre id="pixels"></pre><pre id="losses">0</pre>
<script>
const canvas = document.getElementById('surface');
const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false});
let losses = 0;
canvas.addEventListener('webglcontextlost', e => { losses++; document.getElementById('losses').textContent = losses; });
if (!gl) throw new Error('No context');
function shader(type, source) {
 const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
 if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
 return s;
}
const p = gl.createProgram();
gl.attachShader(p, shader(gl.VERTEX_SHADER, 'attribute vec2 position; void main(){gl_Position=vec4(position,0.,1.);}'));
gl.attachShader(p, shader(gl.FRAGMENT_SHADER, 'precision mediump float; uniform vec4 color; void main(){gl_FragColor=color;}'));
gl.linkProgram(p);
if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link failed');
gl.useProgram(p);
const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
// An explicit attribute location, relinked: the replay in the viewer's context must follow it.
gl.bindAttribLocation(p, 0, 'position'); gl.linkProgram(p); gl.useProgram(p);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const color = gl.getUniformLocation(p,'color');
gl.uniform4f(color,1,0,0,1); gl.viewport(0,0,16,16); gl.drawArrays(gl.TRIANGLES,0,3);
function read() {
 const pixels = new Uint8Array(4); pixels.fill(91);
 gl.readPixels(8,8,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 document.getElementById('pixels').textContent = Array.from(pixels).join(',');
 console.log('WEBGL_PIXELS ' + pixels);
}
document.getElementById('read').onclick = read;
read();
let seenViewer = false;
document.addEventListener('visibilitychange', () => {
 if (!document.hidden) seenViewer = true;
 else if (seenViewer) {
  gl.uniform4f(color,0,1,0,1); gl.drawArrays(gl.TRIANGLES,0,3); read();
  console.log('WEBGL_DETACHED_DRAW');
 }
});
console.log('WEBGL_READY');
</script>
