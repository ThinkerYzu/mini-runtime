<!doctype html><meta charset="utf-8"><title>Large media replay</title>
<button id="play">Play</button>
<video id="mse" muted loop width="320" height="180"></video><pre id="state"></pre><pre id="log"></pre>
<script>
// Task 3450e: a source whose retained history is more than the viewer's 8 MiB journal, so a new
// viewer's snapshot (which carries the replay) is too, while the page keeps changing its DOM.
const video=document.getElementById('mse'), type='video/mp4; codecs="avc1.42c01e"';
function log(s){document.getElementById('log').textContent+=s+'\n';console.log(s);}
const once=(o,t)=>new Promise(resolve=>o.addEventListener(t,resolve,{once:true}));
(async()=>{
 const ms=new MediaSource();video.src=URL.createObjectURL(ms);await once(ms,'sourceopen');
 const sb=ms.addSourceBuffer(type), file=new Uint8Array(await fetch('../bridge-cases/media-v.mp4').then(r=>r.arrayBuffer()));
 // 100 copies of the 4 s file (3.6 MB, under the 4 MiB append limit) over the same range, twice:
 // 7.2 MB of history, 9.6 MB as base64
 const copies=new Uint8Array(file.length*100);
 for(let i=0;i<100;i++)copies.set(file,i*file.length);
 for(let i=0;i<2;i++){const done=once(sb,'updateend');sb.appendBuffer(copies);await done;}
 if(!sb.buffered.length)throw new Error('No buffered range');
 if(video.readyState<3)await once(video,'canplay');
 log('LARGE_READY');
})().catch(e=>log('LARGE_ERROR '+e));
document.getElementById('play').onclick=()=>video.play().then(()=>log('PLAY_OK'),e=>log('PLAY_ERROR '+e.name));
setInterval(()=>document.getElementById('state').textContent=[video.currentTime.toFixed(1),video.paused,video.readyState,video.buffered.length].join(' '),100);
</script>
