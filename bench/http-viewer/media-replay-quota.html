<!doctype html><meta charset="utf-8"><video id="video" muted></video><video id="small" muted></video>
<script>
// Runtime protocol fixture: the test supplies codec/source/buffer replies.
const video=document.getElementById('video'), type='video/mp4; codecs="avc1.42c01e"';
const once=(o,t)=>new Promise(r=>o.addEventListener(t,r,{once:true}));
async function open(){
 const ms=new MediaSource();video.src=URL.createObjectURL(ms);await once(ms,'sourceopen');
 return [ms,ms.addSourceBuffer(type)];
}
(async()=>{
 let [ms,sb]=await open(), count=0;
 if(location.search.includes('unlimited')){
  // 15 MiB of bytes is over 32 MiB after base64/UTF-16 retention accounting.
  for(let i=0;i<15;i++){
   const done=once(sb,'updateend');sb.appendBuffer(new Uint8Array(1024*1024));await done;
  }
  console.log('UNLIMITED_BYTES');
  // Also cross the independent retained-command budget without losing the source.
  for(let i=0;i<10005;i++)sb.timestampOffset=0;
  const done=once(sb,'updateend');sb.appendBuffer(new Uint8Array(1));await done;
  if(ms.readyState!=='open')throw new Error('Unlimited history lost its source');
  console.log('UNLIMITED_COMMANDS');
  try{sb.appendBuffer(new Uint8Array(5*1024*1024));throw new Error('Live append limit was disabled');}
  catch(e){if(e.name!=='QuotaExceededError'||sb.updating)throw e;}
  console.log('LIVE_APPEND_QUOTA');
  video.src='';
  console.log('UNLIMITED_DONE');
  return;
 }
 // Bounded default (B181, task 19b81): past the retention budget a source keeps playing; only its
 // history is dropped, so the 20 MiB all append (11 would fit the budget).
 while(count<20){const done=once(sb,'updateend');sb.appendBuffer(new Uint8Array(1024*1024));await done;count++;}
 if(ms.readyState!=='open'||video.error)throw new Error('Live playback stopped at the budget');
 console.log('LIVE_PAST_BUDGET '+count);
 // a second element's small source fits the freed budget and stays replayable
 const small=document.getElementById('small'), sms=new MediaSource();small.src=URL.createObjectURL(sms);
 await once(sms,'sourceopen');const ssb=sms.addSourceBuffer(type);
 let done=once(ssb,'updateend');ssb.appendBuffer(new Uint8Array(1024));await done;
 small.addEventListener('error',()=>console.log('QUOTA_ERROR the retained source was lost'));
 // the command budget: attach + addsb + 9998 configuration commands, then more, then an append
 video.src='';[ms,sb]=await open();
 for(let i=0;i<10005;i++)sb.timestampOffset=0;
 done=once(sb,'updateend');sb.appendBuffer(new Uint8Array(1));await done;
 if(ms.readyState!=='open'||video.error)throw new Error('Configuration past the budget closed the source');
 console.log('COMMANDS_PAST_BUDGET');
 // a new viewer cannot rebuild the dropped source: it fails, and a new one plays
 video.addEventListener('error',async()=>{
  console.log('DROPPED_LOST '+video.error.message);
  [ms,sb]=await open();
  const done=once(sb,'updateend');sb.appendBuffer(new Uint8Array(1024*1024));await done;
  console.log('CACHE_RELEASED');
 },{once:true});
 console.log('BEFORE_RECONNECT');
})().catch(e=>console.log('QUOTA_ERROR '+e));
</script>
