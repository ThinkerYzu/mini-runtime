<!doctype html>
<meta charset="utf-8"><title>Late image loads and beacons</title>
<button id="start">Insert slow images and send a beacon</button>
<button id="increment">Count while waiting</button><output id="count">0</output>
<button id="detach">Load a detached image</button><button id="insert">Insert it</button><p id="detached">none</p>
<p id="state">idle</p><p id="beacon">unsent</p><p id="loaded">pending</p><div id="list"></div>
<script>
// (B218) a task that inserts images and changes the page: the change shows while the images load;
// (B222) its beacon is held by the server too, and does not hold the task either
const $ = id => document.getElementById(id);
let count = 0;
$('increment').onclick = () => $('count').textContent = String(++count);
$('start').onclick = () => {
  $('start').disabled = true;
  const sizes = [];
  for (let i = 0; i < 3; i++) {
    const img = document.createElement('img');
    img.onload = () => { sizes.push(img.naturalWidth + 'x' + img.naturalHeight + ' ' + img.complete); if (sizes.length === 3) $('loaded').textContent = sizes.join(','); };
    img.onerror = () => $('loaded').textContent = 'error';
    img.src = '/slow-image.gif?' + i;
    $('list').append(img);
  }
  $('beacon').textContent = String(navigator.sendBeacon('/slow-beacon', 'ping'));
  $('state').textContent = 'inserted';
};
// (B222) an image loaded outside the document, inserted later: the viewer loads it as the page asks
let detached = null;
$('detach').onclick = () => {
  detached = new Image();
  detached.onload = () => $('detached').textContent = 'loaded';
  detached.src = '/detached-image.gif';
};
$('insert').onclick = () => { $('list').append(detached); $('detached').textContent = 'inserted'; };
</script>
