<!doctype html>
<html><head><meta charset="utf-8"><title>fetch xframe child</title></head><body>
<script>
(async function () {
  const ws = new URLSearchParams(location.search).get("ws");
  const E = `http://localhost:${ws}`;
  const h = o => `${E}/h?` + new URLSearchParams(o);
  const include = { credentials: "include" };
  const out = [];
  const F = async (what, o) => {
    try { const r = await fetch(h(Object.assign({ acao: "echo", acac: "true" }, o)), include); out.push(what + " " + r.status); }
    catch (e) { out.push(what + " " + e.name); }
  };
  await F("clear", { setcookie: "fp2=; max-age=0; path=/\nfp3=; max-age=0; path=/" });
  await F("first", { id: "c1" });
  await F("set", { id: "c2", setcookie: "fp2=frame; path=/\nfp3=frame; path=/; SameSite=None; Secure" });
  await F("again", { id: "c3" });
  await F("clear", { setcookie: "fp2=; max-age=0; path=/\nfp3=; max-age=0; path=/; SameSite=None; Secure" });
  parent.postMessage(out, "*");
})();
</script></body></html>
