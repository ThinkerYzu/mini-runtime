<!doctype html><meta charset="utf-8"><title>IndexedDB transactions</title>
<script>
window.__log = [];
const L = (...a) => __log.push(a.map(x => JSON.stringify(x)).join(" "));
const P = r => new Promise((resolve,reject) => {r.onsuccess=()=>resolve(r.result);r.onerror=e=>{e.preventDefault();reject(r.error)}});
const end = tx => new Promise(r=>{tx.oncomplete=()=>r("complete");tx.onabort=()=>r("abort")});
const open = (name, version, upgrade) => new Promise((resolve,reject)=>{const r=indexedDB.open(name,version);r.onupgradeneeded=()=>upgrade(r.result,r.transaction);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const throws = (label, fn) => {try{fn();L(label,"no error")}catch(e){L(label,e.name)}};
(async()=>{
 const name="mrt-native-test";
 await P(indexedDB.deleteDatabase(name));
 const db=await open(name,1,db=>{
   const a=db.createObjectStore("a",{keyPath:"meta.id",autoIncrement:true});
   a.createIndex("unique","name",{unique:true});
   a.createIndex("tags","tags",{multiEntry:true});
   db.createObjectStore("b");
   db.createObjectStore("c");
 });
 {
   const tx=db.transaction("a","readwrite"), done=end(tx),s=tx.objectStore("a");
   L("generated",await P(s.add({name:"first",tags:["x","x",null,"y"]})));
   L("injected",(await P(s.get(1))).meta.id);
   throws("invalid inline",()=>s.add({meta:{id:{}},name:"invalid"}));
   try{await P(s.add({name:"first"}))}catch(e){L("unique",e.name)}
   L("after failed generator",await P(s.add({name:"second"})));
   L("multiEntry",await P(s.index("tags").getAllKeys("x")));
   L("first done",await done);
 }
 {
   const tx=db.transaction("a","readwrite"),done=end(tx),s=tx.objectStore("a");
   L("aborted key",await P(s.add({name:"aborted"}))); tx.abort();L("abort result",await done);
   const t=db.transaction("a","readwrite"),d=end(t);L("rollback generator",await P(t.objectStore("a").add({name:"third"})));L("rollback done",await d);
 }
 {
   // Queue a transaction before its predecessor has delivered/committed.
   const first=db.transaction("b","readwrite"), d1=end(first);
   first.objectStore("b").put("committed",1);
   const second=db.transaction("b","readwrite"),d2=end(second);
   const read=P(second.objectStore("b").get(1));
   L("queued visible",await read);L("queue complete",await d1,await d2);
 }
 {
   const a=db.transaction("b","readwrite"),da=end(a);const b=db.transaction("c","readwrite"),dbb=end(b);
   a.objectStore("b").put("left",2);b.objectStore("c").put("right",2);
   L("disjoint commit",await da,await dbb);
   const t=db.transaction(["b","c"]);const left=P(t.objectStore("b").get(2)),right=P(t.objectStore("c").get(2));L("disjoint values",await left,await right);
 }
 {
   const tx=db.transaction("a"),done=end(tx),s=tx.objectStore("a");
   L("compound order",indexedDB.cmp([1,2],[1,3]),indexedDB.cmp(new Date(1),""),indexedDB.cmp("😀","\uE000"));
   L("count zero",(await P(s.getAll(null,0))).length);
   throws("negative count",()=>s.getAll(null,-1));
   L("limited",(await P(s.getAll(null,1))).length);
   L("reverse unique",await new Promise(resolve=>{const a=[],r=s.index("unique").openKeyCursor(null,"prevunique");r.onsuccess=()=>{const c=r.result;if(!c)return resolve(a);a.push([c.key,c.primaryKey]);c.continue()}}));
   L("read done",await done);
 }
 db.close();
 {
   const r=indexedDB.open(name,2);
   await new Promise(resolve=>{
     r.onupgradeneeded=()=>{const d=r.result;d.deleteObjectStore("c");d.createObjectStore("temporary");d.transaction; r.transaction.abort()};
     r.onerror=e=>{e.preventDefault();L("upgrade rollback",r.error.name);resolve()};
   });
   const d=await open(name,1,()=>{});L("schema restored",d.version,Array.from(d.objectStoreNames));d.close();
 }
 {
   const worker=new Worker("idb-native-worker.js");let readyResolve,closeResolve;
   const ready=new Promise(r=>readyResolve=r),closed=new Promise(r=>closeResolve=r);
   worker.onmessage=e=>{if(e.data[0]==="ready")readyResolve();else if(e.data[0]==="closed")closeResolve(e.data);else {L("worker error",e.data);readyResolve();closeResolve(e.data)}};
   worker.postMessage(name);await ready;
   const d=await open(name,2,d=>d.createObjectStore("worker-upgrade"));
   L("worker versionchange",await closed,d.version);d.close();worker.terminate();
 }
 await P(indexedDB.deleteDatabase(name));L("done");
})().catch(e=>L("uncaught",e.name,e.message));
</script>
