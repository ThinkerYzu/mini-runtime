<!doctype html>
<html><head><title>xsite child</title><meta charset="utf-8"></head><body>
<script>
  localStorage.clear();
  localStorage.setItem("who", location.port);
  let parentDoc;
  try { parentDoc = typeof parent.document; } catch (e) { parentDoc = e.name; }
  window.addEventListener("message", e => {
    parent.postMessage({ pong: e.data, storage: localStorage.getItem("who") === location.port, sourceIsParent: e.source === parent }, "*");
  });
  parent.postMessage({ hello: true, parentDoc, top: top === parent, frameElement: window.frameElement }, "*");
</script></body></html>
