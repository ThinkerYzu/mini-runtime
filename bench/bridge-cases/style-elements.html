<!doctype html>
<!-- <style> elements filled by script against release Firefox: bench/compare_bridge.py style-elements.
     Gmail without Trusted Types sets a detached <style>'s innerHTML to its 4 MB of CSS and appends it
     to the head; the sheet must apply (Gecko: HTMLStyleElement::UpdateStyleSheetInternal when the
     element is bound to the tree and when its children change). -->
<html><head><title>style-elements</title><meta charset="utf-8"></head><body>
<div id="a1">a1</div><div id="a2">a2</div><div id="a3">a3</div><div id="a4">a4</div><div id="a5">a5</div>
<div id="a6">a6</div><div id="a7">a7</div><div id="a8">a8</div><div id="a9">a9</div>
<script>
  window.__log = [];
  const log = (...a) => window.__log.push(a.join(" "));
  const width = id => getComputedStyle(document.getElementById(id)).width;
  const add = (how, id) => {
    const s = document.createElement("style");
    const css = `#${id} { width: 101px }`;
    if (how === "innerHTML detached") { s.innerHTML = css; document.head.appendChild(s); }
    else if (how === "textContent detached") { s.textContent = css; document.head.appendChild(s); }
    else if (how === "text node detached") { s.appendChild(document.createTextNode(css)); document.head.appendChild(s); }
    else if (how === "innerHTML connected") { document.head.appendChild(s); s.innerHTML = css; }
    else if (how === "textContent connected") { document.head.appendChild(s); s.textContent = css; }
    else if (how === "text node connected") { document.head.appendChild(s); s.appendChild(document.createTextNode(css)); }
    else if (how === "data change") { s.textContent = "#none {}"; document.head.appendChild(s); s.firstChild.data = css; }
    else if (how === "innerText detached") { s.innerText = css; document.head.appendChild(s); }
    else if (how === "in a fragment") { const f = document.createDocumentFragment(); s.innerHTML = css; f.appendChild(s); document.head.appendChild(f); }
    log(how, width(id), s.textContent.length);
  };
  // the width before, so that layout has run once
  log("before", width("a1"));
  add("innerHTML detached", "a1");
  add("textContent detached", "a2");
  add("text node detached", "a3");
  add("innerHTML connected", "a4");
  add("textContent connected", "a5");
  add("text node connected", "a6");
  add("data change", "a7");
  add("innerText detached", "a8");
  add("in a fragment", "a9");
  // a long sheet set by innerHTML: its rule at the end (Gmail's is 4 MB)
  const long = document.createElement("style");
  long.innerHTML = "#zz" + "z".repeat(10) + " { color: red }\n".repeat(1) + ".filler { color: blue }\n".repeat(15000) + "#a1 { height: 33px }";
  document.head.appendChild(long);
  log("long by innerHTML", long.textContent.length, long.childNodes.length, getComputedStyle(document.getElementById("a1")).height);
  const crlf = document.createElement("style");
  crlf.innerHTML = "#x {}\r\n#y {}\r";
  log("CRLF by innerHTML", JSON.stringify(crlf.textContent));
  log("done");
</script></body></html>
