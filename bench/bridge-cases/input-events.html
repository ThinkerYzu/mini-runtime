<!doctype html>
<meta charset="utf-8">
<title>input events</title>
<style>
  body { margin: 8px; font: 16px sans-serif; }
  #b, #l, #host { display: inline-block; width: 120px; height: 40px; margin: 4px; }
  #t { width: 200px; }
  #s { width: 200px; height: 80px; overflow: auto; border: 1px solid; }
  #s div { height: 400px; }
</style>
<!-- The owner's input (Phase 5.3), done with WebDriver actions (input-events.actions.json) in
     Firefox's tab, and in the bridge tab for the runtime. Every event of the types below is logged
     at the window (capture, with its fields), at its target and at the document (bubble); a timer
     and a microtask set in pointerdown show where its task ends. The log starts after the mouse first
     moved over the scrolled box (the first step): before it, Firefox's own tab has events of its
     window's start (focus, the mouse entering) that the bridge tab had before it caught input. -->
<button id="b">button</button>
<a id="l" href="/elsewhere">link</a>
<span id="host"></span>
<input id="t" value="x">
<input id="c" type="checkbox">
<div id="s"><div>scroll</div></div>
<script>
window.__log = [];
let on = false;
const log = s => { if (on) window.__log.push(s); };
const TYPES = ["pointerover", "pointerenter", "pointerdown", "pointermove", "pointerup", "pointerout", "pointerleave", "mouseover", "mouseenter",
  "mousemove", "mousedown", "mouseup", "mouseout", "mouseleave", "click", "auxclick", "dblclick", "contextmenu", "wheel", "keydown", "keypress",
  "keyup", "focus", "blur", "focusin", "focusout", "beforeinput", "input", "change"];
const desc = n => !n ? String(n) : n === window ? "window" : n === document ? "document" : n.nodeType === 11 ? "shadow-root"
  : n.id ? "#" + n.id : n.localName || n.nodeName;
const kind = e => [PointerEvent, WheelEvent, MouseEvent, KeyboardEvent, FocusEvent, InputEvent, UIEvent, Event].find(C => e instanceof C).name;
const pick = (e, names) => names.filter(f => f in e).map(f => f + "=" + JSON.stringify(e[f])).join(" ");
function fields(e) {
  const out = [pick(e, ["bubbles", "cancelable", "composed", "isTrusted", "detail"])];
  if (e instanceof MouseEvent) out.push(pick(e, ["clientX", "clientY", "pageX", "pageY", "offsetX", "offsetY", "button", "buttons", "ctrlKey", "shiftKey"]), "related=" + desc(e.relatedTarget));
  if (window.PointerEvent && e instanceof PointerEvent) out.push(pick(e, ["pointerId", "pointerType", "isPrimary", "width", "height", "pressure"]));
  if (e instanceof WheelEvent) out.push(pick(e, ["deltaX", "deltaY", "deltaMode"]));
  if (e instanceof KeyboardEvent) out.push(pick(e, ["key", "code", "keyCode", "charCode", "location", "repeat"]));
  if (e instanceof InputEvent) out.push(pick(e, ["data", "inputType"]));
  if (e instanceof FocusEvent) out.push("related=" + desc(e.relatedTarget));
  return out.join(" ");
}
const root = document.getElementById("host").attachShadow({ mode: "open" });
root.innerHTML = "<button id=inner style='width:100px;height:30px'>inner</button>";
for (const type of TYPES) {
  window.addEventListener(type, e => {
    log(`${type} ${kind(e)} target=${desc(e.target)} path0=${desc(e.composedPath()[0])} phase=${e.eventPhase} active=${desc(document.activeElement)} ${fields(e)}`);
  }, true);
  document.addEventListener(type, e => log(`  ${type} bubble at document phase=${e.eventPhase} target=${desc(e.target)}`));
  for (const el of [document.getElementById("b"), document.getElementById("l"), document.getElementById("t"), document.getElementById("c"), root.getElementById("inner")]) {
    el.addEventListener(type, e => log(`  ${type} at ${desc(el)} phase=${e.eventPhase}`));
  }
}
window.addEventListener("pointermove", e => {
  if (!on && e.target === document.querySelector("#s div")) setTimeout(() => { on = true; }, 0);
});
// where the task of a widget event ends: a microtask runs after the listener, a timer after the task
window.addEventListener("pointerdown", () => {
  Promise.resolve().then(() => log("  microtask after pointerdown"));
  setTimeout(() => log("  timeout after pointerdown"), 0);
});
document.getElementById("l").addEventListener("click", e => { e.preventDefault(); log("  link click prevented"); });
document.getElementById("t").addEventListener("input", e => log(`  value ${JSON.stringify(e.target.value)}`));
document.getElementById("c").addEventListener("change", e => log(`  checked ${e.target.checked}`));
// the last step clicks the scrolled box: what the input left behind
document.getElementById("s").addEventListener("click", () => log(`final active=${desc(document.activeElement)} value=${JSON.stringify(document.getElementById("t").value)} checked=${document.getElementById("c").checked} url=${location.pathname}`));
</script>
