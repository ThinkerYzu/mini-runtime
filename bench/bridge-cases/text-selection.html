<!doctype html>
<meta charset="utf-8">
<title>text-selection</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #h { display: none; }
</style>
<!-- A text control's selection (task 36009, GAPS B214): Instagram's search box calls select() on its
     input as it opens; without it a TypeError took the search bar away. Logged: selectionStart,
     selectionEnd and selectionDirection of a text input, a textarea and an input with no frame;
     setSelectionRange with a start after the end, past the value and with each direction; the
     selection properties set one by one; the caret after the value is set; select() and what it
     focuses; the types with no text selection (null, InvalidStateError, select() on a number input
     and on a checkbox); and the select and selectionchange events, as they are seen in the step
     (sync) or after it (a task later). -->
<input id="t" value="hello">
<textarea id="a">one
two</textarea>
<input id="h" value="hidden">
<input id="e" type="email" value="a@b.c">
<input id="n" type="number" value="42">
<input id="c" type="checkbox">
<input id="u" type="bogus" value="xyz">
<input id="empty">
<script>
window.__log = [];
const log = s => window.__log.push(s);
const $ = id => document.getElementById(id);
const desc = n => !n ? String(n) : n === document ? "document" : n.id ? "#" + n.id : n.localName || n.nodeName;
let phase = "sync";
for (const type of ["select", "selectionchange"]) {
  document.addEventListener(type, e => log(`  ${phase} ${type} target=${desc(e.target)} bubbles=${e.bubbles} cancelable=${e.cancelable} isTrusted=${e.isTrusted}`), true);
}
document.addEventListener("focus", e => log(`  ${phase} focus target=${desc(e.target)}`), true);
const sel = el => {
  try { return `${el.selectionStart},${el.selectionEnd},${el.selectionDirection}`; } catch (e) { return e.name; }
};
const attempt = fn => { try { fn(); return "ok"; } catch (e) { return e.name; } };
const steps = [
  ["initial", () => {}],
  ["t.setSelectionRange(1, 3)", () => $("t").setSelectionRange(1, 3)],
  ["t.setSelectionRange(1, 3) again", () => $("t").setSelectionRange(1, 3)],
  ["t.setSelectionRange(4, 2, 'backward')", () => $("t").setSelectionRange(4, 2, "backward")],
  ["t.setSelectionRange(0, 99, 'none')", () => $("t").setSelectionRange(0, 99, "none")],
  ["t.selectionStart = 2", () => { $("t").selectionStart = 2; }],
  ["t.selectionEnd = 1", () => { $("t").selectionEnd = 1; }],
  ["t.selectionDirection = 'backward'", () => { $("t").selectionDirection = "backward"; }],
  ["t.value = 'hi'", () => { $("t").value = "hi"; }],
  ["t.value = 'hi' (same)", () => { $("t").setSelectionRange(0, 1); $("t").value = "hi"; }],
  ["t.select()", () => $("t").select()],
  ["a.setSelectionRange(2, 6)", () => $("a").setSelectionRange(2, 6)],
  ["a.select()", () => $("a").select()],
  ["h.setSelectionRange(1, 2) (no frame)", () => $("h").setSelectionRange(1, 2)],
  ["h.select() (no frame)", () => $("h").select()],
  ["e.setSelectionRange(1, 2) (email)", () => log("  " + attempt(() => $("e").setSelectionRange(1, 2)))],
  ["e.select() (email)", () => $("e").select()],
  ["n.select() (number)", () => $("n").select()],
  ["c.select() (checkbox)", () => $("c").select()],
  ["c.selectionStart = 0 (checkbox)", () => log("  " + attempt(() => { $("c").selectionStart = 0; }))],
  ["u.setSelectionRange(1, 2) (unknown type)", () => $("u").setSelectionRange(1, 2)],
  ["empty.select()", () => $("empty").select()],
];
const els = ["t", "a", "h", "e", "c", "u", "empty"];
addEventListener("load", () => {
  let i = 0;
  const next = () => {
    if (i === steps.length) { log("done"); return; }
    const [name, fn] = steps[i++];
    log(name);
    phase = "sync";
    fn();
    log(`  ${els.map(id => id + "=" + sel($(id))).join(" ")} active=${desc(document.activeElement)}`);
    phase = "later";
    setTimeout(next, 0);
  };
  next();
});
</script>
