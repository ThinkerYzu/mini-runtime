<!doctype html><html><head><meta charset="utf-8"><title>table-sort-js</title>
<style>body{font:13px sans-serif;margin:8px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:2px 6px}th{background:#eee;cursor:pointer}td.n{text-align:right}</style></head>
<body><table id="t"><thead><tr><th>Name</th><th>City</th><th>Score</th><th>Visits</th><th>Code</th></tr></thead><tbody></tbody></table><script>
// A data table: 2,000 rows from a data model, then sorted by a column twice by moving the existing
// rows (as a sortable table widget does), with the header cells' click listeners doing the sorting.
var cities = ["Oslo", "Lima", "Kyoto", "Accra", "Quito", "Perth", "Turin", "Hanoi", "Leeds", "Natal"];
var rows = [];
for (var i = 0; i < 2000; i++) rows.push({ name: "Person " + ((i * 7919) % 2000), city: cities[(i * 31) % 10], score: (i * 37) % 1000 / 10, visits: (i * 13) % 97, code: "C" + ((i * 104729) % 100000) });
var tbody = document.querySelector("#t tbody");
var keys = ["name", "city", "score", "visits", "code"];
rows.forEach(function (r) {
  var tr = document.createElement("tr");
  keys.forEach(function (k) {
    var td = document.createElement("td");
    if (typeof r[k] === "number") td.className = "n";
    td.textContent = String(r[k]);
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});
var ths = document.querySelectorAll("th");
ths.forEach(function (th, col) {
  th.addEventListener("click", function () {
    var trs = Array.prototype.slice.call(tbody.children);
    var numeric = col === 2 || col === 3;
    trs.sort(function (a, b) {
      var x = a.children[col].textContent, y = b.children[col].textContent;
      return numeric ? Number(x) - Number(y) : (x < y ? -1 : x > y ? 1 : 0);
    });
    trs.forEach(function (tr) { tbody.appendChild(tr); });
  });
});
ths[2].dispatchEvent(new Event("click"));
ths[1].dispatchEvent(new Event("click"));
</script></body></html>
