[package]
name = "mrt-js"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# Stage 3: SpiderMonkey from the Firefox tree (obj-js) through a thin C++ layer (glue/), DOM bindings
# over the arena DOM. build.rs calls the C++ compiler directly.
# See README.md.
[dependencies]
mrt-layout = { path = "../mrt-layout" }
mrt-style = { path = "../mrt-style" }
# Public Rust compression crates, pinned and checked against Firefox's compression fixtures.
# custom-prefix exports the existing MOZ_Z_ C ABI configured in .cargo/config.toml.
libz-rs-sys = { version = "=0.6.8", features = ["custom-prefix"] }
zlib-rs = { version = "=0.6.8", features = ["avx512"] }

[profile.release]
debug = false

# One process for all cases, with no test harness: SpiderMonkey must be shut down after the last page
# is dropped (its helper threads hold locks its static destructors would destroy).
[[test]]
name = "bindings"
harness = false

# Stylo 0.22 with Gecko-only properties also generated for the Servo engine (vendor/stylo/README-mrt.md)
[patch.crates-io]
stylo = { path = "../vendor/stylo" }
stylo_atoms = { path = "../vendor/stylo_atoms" }
